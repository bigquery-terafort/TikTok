name: TikTok Ads → BigQuery Sync

on:
  schedule:
    - cron: "0 4 * * *"  # 4:00 AM UTC = 9:00 AM PKT
  workflow_dispatch:
    inputs:
      days:
        description: "Days to sync (default 7)"
        required: false
        default: "7"
      backfill_start:
        description: "Backfill start date (YYYY-MM-DD)"
        required: false
        default: ""
      backfill_end:
        description: "Backfill end date (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tiktok-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync TikTok Ads to BigQuery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TikTok sync
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_ADVERTISER_ID: ${{ secrets.TIKTOK_ADVERTISER_ID }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET: "TikTok"
          BQ_LOCATION: "US"
          # NOTE: script actually reads --days (CLI). TIKTOK_LOOKBACK_DAYS is a
          # dead knob in tiktok_sync.py — kept only so the two never disagree.
          TIKTOK_LOOKBACK_DAYS: ${{ github.event.inputs.days || '7' }}
          # 🛡️ THE WAIVER: /app/list/ returns 0 apps, so the apps_dim guard
          # aborts the whole run — including spend. Attribution is safe without
          # it (tiktok_app_mapping has 24 real rows, 0 placeholders, covering
          # 23 of the 24 app_ids seen in adgroups_dim), so we proceed knowingly.
          #
          # ⚠️⚠️ TEMPORARY HARDCODE — REMOVE once /app/list/ permissions are
          # restored in TikTok Business Center (Assets → App).
          #
          # Hardcoded on purpose: run #95 proved `vars.ALLOW_EMPTY_APPS_DIM`
          # was NOT reaching the job (log showed "apps_dim : required"), most
          # likely because the org variable's repository-access policy doesn't
          # include this repo. Hardcoding removes that variable entirely from
          # the critical path so spend stops bleeding today.
          #
          # Once the org variable is confirmed working, switch back to the
          # safer form below — it falls back to '0', so a missing variable can
          # never silently disarm the guard:
          #   ALLOW_EMPTY_APPS_DIM: ${{ vars.ALLOW_EMPTY_APPS_DIM || '0' }}
          ALLOW_EMPTY_APPS_DIM: "1"
        run: |
          if [ -n "${{ github.event.inputs.backfill_start }}" ] && [ -n "${{ github.event.inputs.backfill_end }}" ]; then
            python tiktok_sync.py \
              --backfill-start "${{ github.event.inputs.backfill_start }}" \
              --backfill-end "${{ github.event.inputs.backfill_end }}"
          else
            python tiktok_sync.py \
              --days "${{ github.event.inputs.days || '7' }}"
          fi
